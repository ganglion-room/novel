<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩具の部屋</title>
    <link rel="stylesheet" href="{{ '/style/all.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
</head>
<header>
<body id="over">
    <div class="to-under">
        <a href="#under">▼ 下へ</a>
    </div>
</header>

<main class="novel">
    <h1>{{ page.ept }}</h1>
{{ content }}
</main>

<footer>
   <hr class="separator">

<!--前話　次話-->
<div class="ep">
    {% if page.prev %}
      <a href="{{ page.prev }}.html" class="prev-ep">← 前話へ</a>
    {% endif %}

    {% if page.next %}
      <a href="{{ page.next }}.html" class="next-ep">次話へ →</a>
    {% endif %}
</div>

    <div class="return" id="under">
        <a href="#over" class="to-over">▲ ページの上へ</a>

<!--目次　ホームページ　トップへ-->
    {% if page.long %}
        <a href="{{ page.snp }}.html" class="to-synopsis">目次に戻る</a>
    {% endif %}
        <a href="{{ '/' | relative_url }}index.html" class="to-home">トップへ戻る🏠️</a>
    </div>
</footer>

</body>
</html>
